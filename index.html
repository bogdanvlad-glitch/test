<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hexacode – Agence Web Moderne</title>
<meta name="description" content="Hexacode est une agence web fondée par Bogdan et Alois. Projets web rapides, modernes et abordables.">

<!-- FAVICON SVG INLINE (1 fichier unique) -->
<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<defs>
<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
<stop offset='0%' stop-color='%236366f1'/>
<stop offset='100%' stop-color='%2322d3ee'/>
</linearGradient>

<rect x='0' y='0' width='100' height='100' rx='22' fill='url(%23g)'/>

</svg>">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f1a;
  --card:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.15);
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#6366f1;
  --secondary:#22d3ee;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:
    radial-gradient(circle at top left,#1e293b,transparent 40%),
    radial-gradient(circle at bottom right,#020617,transparent 40%),
    var(--bg);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:90px 20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:22px;
  color:#020617;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  box-shadow:0 12px 30px rgba(99,102,241,.45);
}

.logo span{
  font-size:26px;
  font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

nav a{
  color:var(--muted);
  margin-left:32px;
  text-decoration:none;
  font-weight:500;
  transition:.3s;
}
nav a:hover{color:white}

.hero{
  margin-top:80px;
  display:flex;
  flex-direction:column;
  gap:40px;
  align-items:center;
  text-align:center;
}

.hero h1{
  font-size:56px;
  font-weight:900;
}

.hero h1 span{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:25px;
  font-size:18px;
  color:var(--muted);
  max-width:700px;
}

.btn{
  display:inline-block;
  margin-top:35px;
  padding:16px 36px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#020617;
  font-weight:700;
  text-decoration:none;
}

footer{
  text-align:center;
  padding:50px;
  color:var(--muted);
}
</style>
</head>

<body>

<header class="container">
  <div class="logo">
    <div class="logo-icon">H</div>
    <span>Hexacode</span>
  </div>
  <nav>
    <a href="#services">Services</a>
    <a href="#team">Équipe</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="container hero">
  <h1>Nous codons vos idées<br><span>rapidement et efficacement</span></h1>
  <p>Des projets web modernes, rapides et accessibles.</p>
  <a class="btn">Nous contacter</a>
</section>

<footer>
© 2026 Hexacode — Tous droits réservés
</footer>

</body>
</html>
